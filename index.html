<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filling My Own Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blush:    #FFB5A7;
    --almond:   #FCD5CE;
    --seashell: #F8EDEB;
    --petal:    #F9DCC4;
    --peach:    #FEC89A;
    --text:     #5C3D35;
    --soft:     #9C7068;
    --faint:    #C4A49E;
  }

  body {
    background: var(--seashell);
    font-family: 'Jost', sans-serif;
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 10% 0%, rgba(255,181,167,0.35) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 100%, rgba(254,200,154,0.3) 0%, transparent 55%);
  }

  .page { max-width: 940px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }

  header { text-align: center; margin-bottom: 3.5rem; }

  .header-ornament {
    display: flex; align-items: center; gap: 1rem;
    justify-content: center; margin-bottom: 1rem;
  }
  .header-ornament .line {
    height: 1px; width: 64px;
    background: linear-gradient(to right, transparent, var(--blush));
  }
  .header-ornament .line.r { background: linear-gradient(to left, transparent, var(--blush)); }
  .header-ornament .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--blush); opacity: 0.7;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 600; font-style: italic;
    color: var(--text); letter-spacing: 0.01em; line-height: 1.1;
  }

  .subtitle {
    font-size: 0.75rem; color: var(--faint); margin-top: 0.55rem;
    font-weight: 300; letter-spacing: 0.22em; text-transform: uppercase;
  }

  .main-layout {
    display: grid; grid-template-columns: 240px 1fr;
    gap: 3.5rem; align-items: start;
  }

  @media (max-width: 640px) {
    .main-layout { grid-template-columns: 1fr; }
    .cup-section { display: flex; flex-direction: column; align-items: center; }
  }

  /* Cup */
  .cup-wrap { width: 200px; margin: 0 auto; }

  .steam-container {
    display: flex; gap: 12px; justify-content: center;
    height: 44px; align-items: flex-end; margin-bottom: 2px;
  }

  .steam-line {
    width: 2.5px; border-radius: 99px; background: var(--blush);
    transform-origin: bottom center; opacity: 0;
    animation: rise 2.6s ease-in-out infinite;
  }
  .steam-line:nth-child(1) { height: 26px; animation-delay: 0s; }
  .steam-line:nth-child(2) { height: 38px; animation-delay: 0.6s; }
  .steam-line:nth-child(3) { height: 20px; animation-delay: 1.2s; }

  @keyframes rise {
    0%   { opacity: 0; transform: scaleY(0) translateY(8px); }
    20%  { opacity: 0.6; transform: scaleY(1) translateY(0); }
    80%  { opacity: 0.25; }
    100% { opacity: 0; transform: scaleY(1.5) translateY(-14px); }
  }

  svg.cup-svg { display: block; width: 200px; overflow: visible; }

  .cup-score { text-align: center; margin-top: 1.4rem; }

  .score-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 3.8rem; font-weight: 600;
    color: var(--blush); line-height: 1; letter-spacing: -0.02em;
  }

  .score-label {
    font-size: 0.68rem; color: var(--faint);
    text-transform: uppercase; letter-spacing: 0.22em;
    margin-top: 0.1rem; font-weight: 400;
  }

  .cup-date {
    font-size: 0.82rem; color: var(--soft); margin-top: 0.5rem;
    font-style: italic; font-family: 'Cormorant Garamond', serif;
  }

  /* Entries */
  .entries-section h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem; font-style: italic;
    color: var(--text); margin-bottom: 1.1rem;
    font-weight: 400; letter-spacing: 0.02em;
  }

  .entries-list {
    display: flex; flex-direction: column; gap: 0.65rem;
    max-height: 500px; overflow-y: auto; padding-right: 6px;
  }
  .entries-list::-webkit-scrollbar { width: 3px; }
  .entries-list::-webkit-scrollbar-track { background: transparent; }
  .entries-list::-webkit-scrollbar-thumb { background: var(--almond); border-radius: 99px; }

  .entry-card {
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,181,167,0.3);
    border-radius: 14px; padding: 0.9rem 1.1rem;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .entry-card:hover {
    background: rgba(255,255,255,0.8);
    box-shadow: 0 3px 18px rgba(255,181,167,0.2);
  }

  .entry-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 0.4rem;
  }

  .entry-date { font-size: 0.73rem; color: var(--faint); font-weight: 300; letter-spacing: 0.04em; }

  .entry-score-badge {
    font-size: 0.67rem; font-weight: 500;
    padding: 2px 10px; border-radius: 99px; letter-spacing: 0.06em;
  }

  .score-low  { background: rgba(255,181,167,0.25); color: #A0544A; }
  .score-mid  { background: rgba(254,200,154,0.35); color: #8A6230; }
  .score-high { background: rgba(160,210,160,0.28); color: #3A6B40; }

  .entry-note {
    font-size: 0.93rem; line-height: 1.62; color: var(--text);
    font-family: 'Cormorant Garamond', serif; font-style: italic;
  }

  .status {
    text-align: center; margin-top: 2rem; font-size: 0.75rem;
    color: var(--faint); min-height: 1em; letter-spacing: 0.05em;
  }
  .status.error { color: #C06060; }

  .empty-state {
    text-align: center; padding: 2.5rem 1rem; color: var(--faint);
    font-style: italic; font-family: 'Cormorant Garamond', serif; font-size: 1rem;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="header-ornament">
      <span class="line"></span>
      <span class="dot"></span>
      <span class="dot" style="opacity:0.4; width:4px; height:4px;"></span>
      <span class="dot"></span>
      <span class="line r"></span>
    </div>
    <h1>Filling My Own Cup</h1>
    <p class="subtitle">a daily practice of noticing</p>
  </header>

  <div class="main-layout">
    <div class="cup-section">
      <div class="cup-wrap">
        <div class="steam-container" id="steamContainer">
          <div class="steam-line"></div>
          <div class="steam-line"></div>
          <div class="steam-line"></div>
        </div>
        <svg class="cup-svg" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="cupClip">
              <polygon points="34,26 166,26 180,212 20,212"/>
            </clipPath>
            <linearGradient id="liqG" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%"   stop-color="#FFB5A7" stop-opacity="0.72"/>
              <stop offset="55%"  stop-color="#FEC89A" stop-opacity="0.82"/>
              <stop offset="100%" stop-color="#FCD5CE" stop-opacity="0.72"/>
            </linearGradient>
            <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%"   stop-color="#FCD5CE"/>
              <stop offset="38%"  stop-color="#FFF4F2"/>
              <stop offset="100%" stop-color="#F9DCC4"/>
            </linearGradient>
          </defs>
          <!-- Handle -->
          <path d="M 168 88 Q 210 88 210 136 Q 210 174 168 174"
                fill="none" stroke="#FCD5CE" stroke-width="15" stroke-linecap="round"/>
          <path d="M 168 88 Q 203 88 203 136 Q 203 168 168 174"
                fill="none" stroke="#FFF4F2" stroke-width="6.5" stroke-linecap="round"/>
          <!-- Body -->
          <polygon points="26,20 174,20 188,216 12,216"
                   fill="url(#bodyG)" stroke="#FCD5CE" stroke-width="1.2"/>
          <!-- Fill -->
          <rect id="liquidRect" x="12" y="216" width="176" height="0"
                fill="url(#liqG)" clip-path="url(#cupClip)"/>
          <!-- Surface -->
          <ellipse id="liquidSurface" cx="100" cy="216" rx="76" ry="4"
                   fill="#FEC89A" opacity="0"/>
          <!-- Shine -->
          <polygon points="44,28 64,28 54,208 36,208" fill="white" opacity="0.13"/>
          <!-- Rim -->
          <ellipse cx="100" cy="20" rx="74" ry="8.5"
                   fill="#FCD5CE" stroke="#FFB5A7" stroke-width="1"/>
          <!-- Base -->
          <ellipse cx="100" cy="216" rx="88" ry="6.5"
                   fill="#FCD5CE" stroke="#FFB5A7" stroke-width="0.8"/>
          <!-- Flower motif -->
          <g opacity="0.18" transform="translate(68,138)">
            <circle cx="0" cy="0" r="3" fill="#FFB5A7"/>
            <ellipse cx="0" cy="-9" rx="2.8" ry="5.5" fill="#FFB5A7"/>
            <ellipse cx="0" cy="9"  rx="2.8" ry="5.5" fill="#FFB5A7"/>
            <ellipse cx="-9" cy="0" rx="5.5" ry="2.8" fill="#FFB5A7"/>
            <ellipse cx="9"  cy="0" rx="5.5" ry="2.8" fill="#FFB5A7"/>
            <ellipse cx="-6" cy="-6" rx="2.8" ry="5" fill="#FEC89A" transform="rotate(-45 -6 -6)"/>
            <ellipse cx="6"  cy="-6" rx="2.8" ry="5" fill="#FEC89A" transform="rotate(45 6 -6)"/>
            <ellipse cx="-6" cy="6"  rx="2.8" ry="5" fill="#FEC89A" transform="rotate(45 -6 6)"/>
            <ellipse cx="6"  cy="6"  rx="2.8" ry="5" fill="#FEC89A" transform="rotate(-45 6 6)"/>
          </g>
        </svg>
      </div>
      <div class="cup-score">
        <div class="score-num" id="scoreDisplay">–</div>
        <div class="score-label">out of 10</div>
        <div class="cup-date" id="latestDate">loading…</div>
      </div>
    </div>

    <div class="entries-section">
      <h2>how I've been feeling</h2>
      <div class="entries-list" id="entriesList">
        <div class="empty-state">your entries will bloom here…</div>
      </div>
    </div>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQnd8vsmroOCKxTrD_2PLJLWjiqCHXLDQmzpCNrZ8Yzr24qzpQsnzshQIVspAePCPiRMH_fxg9Sd1yQ/pub?gid=0&single=true&output=csv';
const PROXY = 'https://corsproxy.io/?';

function scoreClass(s) {
  if (s <= 4) return 'score-low';
  if (s <= 6) return 'score-mid';
  return 'score-high';
}

function formatDate(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return str;
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

function animateCup(score) {
  const pct   = Math.max(0, Math.min(10, score)) / 10;
  const fillH = Math.round((212 - 26) * pct);
  const fillY = 212 - fillH;
  const rect  = document.getElementById('liquidRect');
  const surf  = document.getElementById('liquidSurface');
  rect.style.transition = 'none'; surf.style.transition = 'none';
  rect.setAttribute('y', '216'); rect.setAttribute('height', '0');
  requestAnimationFrame(() => {
    rect.style.transition = 'height 1.4s cubic-bezier(0.34,1.4,0.64,1), y 1.4s cubic-bezier(0.34,1.4,0.64,1)';
    surf.style.transition  = 'cy 1.4s cubic-bezier(0.34,1.4,0.64,1), opacity 0.5s';
    rect.setAttribute('y', fillY); rect.setAttribute('height', fillH);
    surf.setAttribute('cy', fillY); surf.setAttribute('opacity', pct > 0.02 ? '0.55' : '0');
  });
  document.getElementById('steamContainer').style.opacity = pct >= 0.5 ? '1' : String(pct * 2);
}

function renderEntries(rows) {
  const list = document.getElementById('entriesList');
  if (!rows.length) { list.innerHTML = '<div class="empty-state">no entries yet — write something in your sheet</div>'; return; }
  list.innerHTML = rows.slice(0, 30).map(r => `
    <div class="entry-card">
      <div class="entry-header">
        <span class="entry-date">${formatDate(r.date)}</span>
        <span class="entry-score-badge ${scoreClass(parseFloat(r.score)||0)}">${r.score} / 10</span>
      </div>
      ${r.note ? `<div class="entry-note">${r.note}</div>` : ''}
    </div>`).join('');
}

function setStatus(msg, err) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = 'status' + (err ? ' error' : '');
}

function parseCSV(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];
  const h = lines[0].split(',').map(s => s.trim().toLowerCase().replace(/[^a-z]/g, ''));
  const di = h.findIndex(s => s.includes('date'));
  const si = h.findIndex(s => s.includes('score'));
  const ni = h.findIndex(s => s.includes('note'));
  return lines.slice(1).map(line => {
    const c = line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(s => s.replace(/^"|"$/g, '').trim());
    return { date: di >= 0 ? c[di] : '', score: si >= 0 ? c[si] : '0', note: ni >= 0 ? c[ni] : '' };
  }).filter(r => r.score && r.score !== 'Score').reverse();
}

async function loadSheet() {
  const local = window.location.protocol === 'file:' || window.location.origin === 'null';
  const url   = local ? PROXY + encodeURIComponent(SHEET_URL) : SHEET_URL;
  let text;
  try {
    const r = await fetch(url, { redirect: 'follow' });
    if (!r.ok) throw new Error();
    text = await r.text();
  } catch {
    if (!local) {
      try { const r2 = await fetch(PROXY + encodeURIComponent(SHEET_URL)); text = await r2.text(); }
      catch { setStatus('could not reach your sheet right now', true); document.getElementById('latestDate').textContent = ''; return; }
    } else {
      setStatus('could not reach your sheet right now', true); document.getElementById('latestDate').textContent = ''; return;
    }
  }
  const rows = parseCSV(text);
  if (!rows.length) { document.getElementById('latestDate').textContent = ''; document.getElementById('entriesList').innerHTML = '<div class="empty-state">add some rows to your sheet to begin</div>'; return; }
  const score = parseFloat(rows[0].score) || 0;
  document.getElementById('scoreDisplay').textContent = Number.isInteger(score) ? score : score.toFixed(1);
  document.getElementById('latestDate').textContent   = formatDate(rows[0].date);
  animateCup(score); renderEntries(rows);
}

window.addEventListener('DOMContentLoaded', loadSheet);
</script>
</body>
</html>
